<div id="registerTopBar">
  <a routerLink="/" id="brand">PlanFlow</a>
</div>

<div id="registerPage">
  <div id="registerCard">
    <h2 id="registerTitle">😉 Welcome!</h2>
    <p id="registerSubtitle">Make your preparation journey smooth with us</p>

    <form #registerForm="ngForm" class="d-flex flex-column"
      (ngSubmit)="registerBtn(name.value ,email.value, password.value)">

      <label class="fw-semibold">Name</label>
      <input type="text" name="name" #name="ngModel" [(ngModel)]="user.name" required />
      <div *ngIf="name.invalid && name.touched" class="fieldError">
        Name is required.
      </div>

      <label class="fw-semibold">Email</label>
      <input type="email" name="email" #email="ngModel" [(ngModel)]="user.email" required />
      <div *ngIf="email.invalid && email.touched" class="fieldError">
        Valid email is required.
      </div>

      <label class="fw-semibold">Password</label>
      <input type="password" name="password" #password="ngModel" [(ngModel)]="user.password" required minlength="5" />
      <div *ngIf="password.invalid && password.touched" class="fieldError">
        Password must be at least 5 characters.
      </div>

      <p class="fieldError" *ngIf="isValid==false">Registration failed. Please check your details and try again.</p>

      <button type="submit" [disabled]="registerForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Registering...' : 'Register' }}
      </button>
    </form>

    <p id="switchToLogin">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
